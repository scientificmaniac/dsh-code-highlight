name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests (no Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run smoke tests
        run: npm test
      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.txt
          if-no-files-found: ignore

  raster:
    name: PNG pipeline (Python + Pillow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and CJK-capable fonts
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk
      - name: Run rasterization tests
        run: npm run test:raster
